<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600" role="img" aria-label="The Anxious Generation by Jonathan Haidt">
  <defs>
    <linearGradient id="grad-pick-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#1d3557" />
    </linearGradient>
    <linearGradient id="spine-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.3)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.15)" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="600" rx="6" fill="url(#grad-pick-2)" />

  <!-- Abstract Design Graphic -->
  <g opacity="0.35">
    <circle cx="200" cy="280" r="110" fill="none" stroke="#f1faee" stroke-width="3" />
    <circle cx="200" cy="280" r="70" fill="none" stroke="#f1faee" stroke-width="1.5" stroke-dasharray="6,6" />
    <circle cx="200" cy="280" r="25" fill="#f1faee" opacity="0.6" />
    <line x1="120" y1="280" x2="280" y2="280" stroke="#f1faee" stroke-width="1.5" />
    <line x1="200" y1="200" x2="200" y2="360" stroke="#f1faee" stroke-width="1.5" />
  </g>

  <!-- Inner Frame Line -->
  <rect x="25" y="25" width="350" height="550" rx="4" fill="none" stroke="#f1faee" stroke-width="1" opacity="0.4" />

  <!-- Spine Shadow for realistic book feel -->
  <rect x="0" y="0" width="18" height="600" rx="6" fill="url(#spine-shadow)" />

  <!-- Typography: Title & Author -->
  <g text-anchor="middle">
    <!-- Top Emblem / Category -->
    <text x="200" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#f1faee" letter-spacing="4">PAGE &amp; PINE EDITION</text>
    
    <!-- Main Title -->
    <text x="200" y="145" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#f9fafb" letter-spacing="0.5">The Anxious</text>
    <text x="200" y="180" font-family="'Playfair Display', Georgia, serif" font-size="24" font-style="italic" fill="#f9fafb" letter-spacing="0.5">Generation</text>
    
    <!-- Divider -->
    <line x1="170" y1="205" x2="230" y2="205" stroke="#f1faee" stroke-width="2" />
    
    <!-- Author -->
    <text x="200" y="480" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb" letter-spacing="2">BY JONATHAN HAIDT</text>
    <text x="200" y="525" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#f1faee" letter-spacing="1.5">NATIONAL BESTSELLER</text>
  </g>
</svg>
